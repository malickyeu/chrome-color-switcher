name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Tag matches the manifest version
        run: |
          version=$(node -p "require('./manifest.json').version")
          pkg=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != manifest $version"; exit 1; }
          test "$pkg" = "$version" || { echo "package.json $pkg != manifest $version"; exit 1; }

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: |
          npx -y playwright@1.65.1 install --with-deps chromium
          npm run test:e2e

      - name: Build zip
        id: pack
        run: |
          zip=$(npm run -s pack)
          (cd dist && sha256sum "$(basename "$zip")" > "$(basename "$zip").sha256")
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Release notes from commits since the previous tag
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          range=${prev:+$prev..}$GITHUB_REF_NAME
          {
            echo "## Changes"
            git log --no-merges --pretty='- %s' "$range"
            echo
            echo "Install: unzip, open \`chrome://extensions\`, turn on Developer mode, **Load unpacked** and pick the folder."
          } > notes.md
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.pack.outputs.zip }}" "${{ steps.pack.outputs.zip }}.sha256" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
