<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <title>Color Switcher</title>
  <link rel="stylesheet" href="../ui/controls.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="site">
      <label class="label" for="scope">Platí pro</label>
      <strong id="host" hidden>–</strong>
      <select id="scope" title="Nastavení může platit pro celý web, nebo jen pro část (např. /chat)"></select>
    </div>
    <label class="switch" title="Zapnout na tomto webu (Alt+Shift+D)">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </header>

  <p id="unsupported" class="notice" hidden>Na této stránce rozšíření běžet nemůže (interní stránky prohlížeče, Web Store…).</p>

  <main id="main">
    <div id="controls"></div>

    <section>
      <div class="row head">
        <h2>Analýza stránky</h2>
        <button id="analyze" class="small">Analyzovat</button>
      </div>
      <div id="report" hidden>
        <p id="summary" class="muted"></p>
        <div class="palette-group"><span>Pozadí</span><div id="palBg" class="palette"></div></div>
        <div class="palette-group"><span>Text</span><div id="palText" class="palette"></div></div>
        <div class="palette-group"><span>Akcenty</span><div id="palAccent" class="palette"></div></div>
        <div class="palette-group"><span>Z CSS</span><div id="palCss" class="palette"></div></div>
        <p class="muted hint">Klik na barvu: v režimu Mono nastaví odstín, ve Vlastním akcent, jinak ji zkopíruje.</p>
        <div class="actions">
          <button id="monoFromAccent" class="small">Mono z hlavního akcentu</button>
          <button id="customFromPage" class="small">Vlastní z palety webu</button>
        </div>
      </div>
      <p id="analyzeError" class="notice" hidden></p>
    </section>
  </main>

  <footer>
    <button id="openPreview" class="link" title="Otevřít náhled schématu na ukázkovém webu">Náhled</button>
    <button id="saveDefault" class="link" title="Použít aktuální nastavení pro všechny weby bez vlastního nastavení">Nastavit jako výchozí</button>
    <button id="resetSite" class="link" title="Smazat nastavení pro vybraný rozsah">Zapomenout</button>
    <span id="toast" class="toast" aria-live="polite"></span>
  </footer>

  <script src="../src/color.js"></script>
  <script src="../src/scheme.js"></script>
  <script src="../src/settings.js"></script>
  <script src="../ui/controls.js"></script>
  <script src="popup.js"></script>
</body>
</html>
